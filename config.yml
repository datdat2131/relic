    name: "Lõi Địa Mạch"
    rarity: RARE
    group: MINER
    set: frostborn
    icon: AMETHYST_SHARD
    description: ["Năng lượng của lòng đất", "chảy trong từng nhát cuốc."]
    stats: {HEALTH: 4, ARMOR: 1}
    passive: {type: HASTE, value: 0, unlock-level: 10}
    aura: {particle: DUST, style: RING, color: "#55FF55"}
  resonance_crystal:
    name: "Tinh Thể Cộng Hưởng"
    rarity: EPIC
    group: MINER
    set: frostborn
    icon: PRISMARINE_CRYSTALS
    description: ["Tinh thể rung theo nhịp đào,", "hút nguyên liệu về phía bạn."]
    stats: {DAMAGE: 3, SPEED: 2, HEALTH: 2}
    passive: {type: MATERIAL_LUCK, value: 8, unlock-level: 10}
    aura: {particle: END_ROD, style: ORBIT}
  miner_eye:
    name: "Mắt Thợ Mỏ"
    rarity: RARE
    group: MINER
    set: frostborn
    icon: SPYGLASS
    description: ["Đôi mắt quen với bóng tối", "và những cú rơi sâu trong box."]
