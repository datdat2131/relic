# ============================================================
#  AstraxRelic - Hệ thống Di Vật độc quyền của AstraxBox
#  Mã màu dùng dấu & (vd: &a, &b, &6).
#  Buff chỉ gồm: HEALTH (máu, 2 = 1 tim), DAMAGE (%), ARMOR (điểm), SPEED (%)
#  + Nội tại ẩn (mở khóa theo cấp) + vật phẩm mini bay quanh người để người khác nhìn thấy.
# ============================================================

messages:
  prefix: "&8[&bAstraxRelic&8] &7"

settings:
  slots: 3                    # số slot thường (1-3). Slot thứ 4 là slot đặc biệt, xem ultimate-quest
  max-level: 30
  level-scale: 0.04           # chỉ số = base * (1 + (level-1) * level-scale)
  lifesteal-cap-per-hit: 4    # hút máu tối đa mỗi đòn (máu)
  broadcast-min-rarity: LEGENDARY   # báo cả server khi ai chế tạo Relic từ độ hiếm này (NONE = tắt)

# Trần tổng chỉ số (đã gồm bonus bộ Set) để cân bằng server
caps:
  HEALTH: 40                  # +40 máu = +20 tim
  DAMAGE: 100                 # +100%
  ARMOR: 16
  SPEED: 40                   # +40%

# Vật phẩm mini bay quanh người chơi (thay cho particle)
orbit:
  enabled: true
  update-ticks: 2             # tần suất cập nhật vị trí (tick). Tăng lên nếu server nặng
  hide-from-owner: false      # true = chỉ người khác thấy, chủ không thấy
  default-scale: 0.35         # kích thước vật phẩm

# Thử Thách Tối Thượng: hoàn thành TẤT CẢ để mở Slot Relic thứ 4 (Admin cũng có thể cấp:
#   /relicadmin slot <người> unlock)
ultimate-quest:
  enabled: true
  broadcast: true             # báo cả server khi có người hoàn thành
  boss-kills: 30
  mob-kills: 10000
  blocks-mined: 100000
  relics-owned: 15            # số Di Vật đang sở hữu
  relic-max-level: 30         # có ít nhất 1 Di Vật đạt cấp này
  own-rarity: MYTHIC          # sở hữu ít nhất 1 Di Vật độ hiếm này trở lên (để trống = bỏ qua)

# Relic Rush: sự kiện tăng tỉ lệ rơi nguyên liệu toàn server
#   Admin bật tay: /relicadmin rush start [phút]   |   tắt: /relicadmin rush stop
relic-rush:
  auto: false                 # true = tự động bật định kỳ
  interval-minutes: 60        # chu kỳ tự động
  duration-minutes: 10
  multiplier: 2.0             # nhân tỉ lệ rơi
  bossbar: true

# Sàn tối thiểu của tổng chỉ số (do Lời nguyền có thể trừ chỉ số)
floors:
  HEALTH: -10                 # tối đa bị trừ 10 máu (không xuống dưới 10 máu)
  DAMAGE: -50
  ARMOR: -10
  SPEED: -30

# Khám phá Relic ẩn
discovery:
  deep-y: -40                 # block đào ở độ cao Y <= giá trị này tính là "đào sâu" (loại DEEP_BLOCKS)

# Gem khảm vào ổ khảm của Relic. Chế tạo bằng Dust/Core trong GUI Hồ sơ (Q ở Codex).
# Gem cộng chỉ số cố định, không tăng theo cấp.
gems:
  ruby:
    name: "&cRuby"
    stat: DAMAGE
    value: 2
    cost-dust: 60
    icon: RED_DYE
  sapphire:
    name: "&9Sapphire"
    stat: ARMOR
    value: 1
    cost-dust: 60
    icon: LAPIS_LAZULI
  emerald:
    name: "&aEmerald"
    stat: HEALTH
    value: 2
    cost-dust: 60
    icon: EMERALD
  topaz:
    name: "&eTopaz"
    stat: SPEED
    value: 2
    cost-dust: 60
    icon: YELLOW_DYE
  greater_ruby:
    name: "&c&lRuby Lớn"
    stat: DAMAGE
    value: 4
    cost-dust: 150
    cost-core: 2
    icon: REDSTONE_BLOCK
  greater_sapphire:
    name: "&9&lSapphire Lớn"
    stat: ARMOR
    value: 2
    cost-dust: 150
    cost-core: 2
    icon: LAPIS_BLOCK
  greater_emerald:
    name: "&a&lEmerald Lớn"
    stat: HEALTH
    value: 4
    cost-dust: 150
    cost-core: 2
    icon: EMERALD_BLOCK
  greater_topaz:
    name: "&e&lTopaz Lớn"
    stat: SPEED
    value: 4
    cost-dust: 150
    cost-core: 2
    icon: GOLD_BLOCK

upgrade:
  dust-base: 10               # Dust cần = dust-base * (1 + level * dust-growth) * cost-mult
  dust-growth: 0.15

recycle:
  refund-ratio: 0.5

# Block nào tính là "đào mỏ" để rơi nguyên liệu (tên Material chứa từ này)
mining:
  mineable-tokens: [ORE, STONE, DEEPSLATE, ANCIENT_DEBRIS, NETHERRACK, OBSIDIAN, BASALT, BLACKSTONE]

# Cách nhận diện Boss (đủ 1 điều kiện là tính)
boss:
  min-health: 100
  types: [WITHER, ENDER_DRAGON, WARDEN, ELDER_GUARDIAN]
  name-keywords: ["Boss"]

rarities:
  COMMON:
    name: "Thường"
    color: "&f"
    craft-shards: 20
    craft-cores: 0
    cost-mult: 1.0
    milestone-cores: 0        # Core cần khi nâng từ cấp 10, 20
    sockets: 1                # số ổ khảm Gem (0-3)
  RARE:
    name: "Hiếm"
    color: "&9"
    craft-shards: 50
    cost-mult: 1.5
    milestone-cores: 1
    sockets: 1
  EPIC:
    name: "Sử Thi"
    color: "&5"
    craft-shards: 120
    cost-mult: 2.2
    milestone-cores: 2
    sockets: 2
  LEGENDARY:
    name: "Huyền Thoại"
    color: "&6"
    craft-shards: 300
    craft-cores: 2
    cost-mult: 3.5
    milestone-cores: 4
    sockets: 2
  MYTHIC:
    name: "Thần Thoại"
    color: "&c"
    craft-shards: 600
    craft-cores: 10
    cost-mult: 5.0
    milestone-cores: 6
    sockets: 3
  CELESTIAL:
    name: "Thiên Giới"
    color: "&b"
    craftable: false          # chỉ nhận từ sự kiện / Admin
    cost-mult: 7.0
    milestone-cores: 8
    sockets: 3

# Nguyên liệu rơi (chance 0.01 = 1%). Nội tại MATERIAL_LUCK nhân thêm vào tỉ lệ.
drops:
  block-break:
    dust:  {chance: 0.012,  min: 1, max: 2}
    shard: {chance: 0.003,  min: 1, max: 1}
    core:  {chance: 0.0002, min: 1, max: 1}
  mob-kill:
    dust:  {chance: 0.05,  min: 1, max: 2}
    shard: {chance: 0.02,  min: 1, max: 1}
    core:  {chance: 0.001, min: 1, max: 1}
  boss-kill:
    dust:  {chance: 1.0,  min: 5, max: 10}
    shard: {chance: 1.0,  min: 3, max: 6}
    core:  {chance: 0.25, min: 1, max: 2}

# Bộ Relic. Key là số món cần trang bị (tối đa 4, món thứ 4 cần slot đặc biệt).
# Từ 3 món cùng bộ: các vật phẩm bay quanh người sẽ phát sáng theo màu của bộ (glow-color).
sets:
  frostborn:
    name: "&b❄ Frostborn"
    icon: BLUE_ICE
    glow-color: "#55FFFF"
    bonuses:
      2: {SPEED: 2, HEALTH: 2}
      3: {SPEED: 4, HEALTH: 4, ARMOR: 1}
      4: {SPEED: 6, HEALTH: 8, ARMOR: 2}
  infernal:
    name: "&c🔥 Infernal"
    icon: MAGMA_CREAM
    glow-color: "#FF5555"
    bonuses:
      2: {DAMAGE: 4}
      3: {DAMAGE: 8, HEALTH: 4}
      4: {DAMAGE: 14, HEALTH: 6}
  abyss:
    name: "&8☠ Abyss"
    icon: ECHO_SHARD
    glow-color: "#8855FF"
    bonuses:
      2: {ARMOR: 2}
      3: {ARMOR: 3, HEALTH: 6, DAMAGE: 4}
      4: {ARMOR: 5, HEALTH: 10, DAMAGE: 8}
  fortune:
    name: "&6$ Fortune"
    icon: GOLD_INGOT
    glow-color: "#FFD700"
    bonuses:
      2: {HEALTH: 4}
      3: {HEALTH: 8, ARMOR: 1}
      4: {HEALTH: 14, ARMOR: 2}
  astral:
    name: "&d✦ Astral"
    icon: AMETHYST_SHARD
    glow-color: "#FF55FF"
    bonuses:
      2: {SPEED: 3}
      3: {SPEED: 5, DAMAGE: 4}
      4: {SPEED: 8, DAMAGE: 8}

# ------------------------------------------------------------
# 20 Di Vật.
#  group : ATTACK | GUARD | VITAL | SWIFT | MINER | MYSTIC
#  stats : HEALTH | DAMAGE | ARMOR | SPEED (giá trị ở cấp 1, tăng theo level-scale)
#  passive (nội tại ẩn, chỉ hiện khi đạt unlock-level):
#     type: LIFESTEAL THORNS CRIT DODGE EXECUTE BOSS_SLAYER LAST_STAND
#           KILL_SPEED HASTE KILL_HEAL LOW_HP_GUARD MATERIAL_LUCK FALL_GUARD REGEN
#           COMBO (value=%/lớp, chance=số lớp tối đa, cooldown=giây mất lớp)
#           SHIELD (value=% chặn, cooldown=giây hồi) RAGE (value=% tối đa) PLUNDER (value=% rơi thêm)
#     value, chance (CRIT/DODGE), cooldown (giây), unlock-level
#  curse : lời nguyền, chỉ số bị trừ cố định {stat, value (âm), text}
#  hidden/hint/discover : Relic bí ẩn. discover.type: BLOCKS DEEP_BLOCKS BOSS_KILLS MOB_KILLS
#          OWN_SET (set) RELIC_LEVEL (relic, value) EVENT (Admin cấp bằng /relicadmin discover)
#  orbit : vật phẩm mini bay quanh người. item (mặc định = icon), style (ORBIT HALO FEET WING),
#          scale (kích thước, tùy chọn)
# ------------------------------------------------------------
