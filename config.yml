# ============================================================
#  AstraxRelic - Hệ thống Di Vật độc quyền của AstraxBox
#  Mã màu dùng dấu & (vd: &a, &b, &6).
#  Buff chỉ gồm: HEALTH (máu, 2 = 1 tim), DAMAGE (%), ARMOR (điểm), SPEED (%)
#  + Nội tại ẩn (mở khóa theo cấp) + Aura riêng để người khác nhìn thấy.
# ============================================================

messages:
  prefix: "&8[&bAstraxRelic&8] &7"

settings:
  slots: 3                    # số Di Vật trang bị cùng lúc (1-3)
  max-level: 30
  level-scale: 0.04           # chỉ số = base * (1 + (level-1) * level-scale)
  aura-enabled: true          # bật/tắt hiệu ứng particle
  lifesteal-cap-per-hit: 4    # hút máu tối đa mỗi đòn (máu)

# Trần tổng chỉ số (đã gồm bonus bộ Set) để cân bằng server
caps:
  HEALTH: 40                  # +40 máu = +20 tim
  DAMAGE: 100                 # +100%
  ARMOR: 16
  SPEED: 40                   # +40%

upgrade:
  dust-base: 10               # Dust cần = dust-base * (1 + level * dust-growth) * cost-mult
  dust-growth: 0.15

recycle:
  refund-ratio: 0.5

# Block nào tính là "đào mỏ" để rơi nguyên liệu (tên Material chứa từ này)
mining:
  mineable-tokens: [ORE, STONE, DEEPSLATE, ANCIENT_DEBRIS, NETHERRACK, OBSIDIAN, BASALT, BLACKSTONE]

# Cách nhận diện Boss (đủ 1 điều kiện là tính)
boss:
  min-health: 100
  types: [WITHER, ENDER_DRAGON, WARDEN, ELDER_GUARDIAN]
  name-keywords: ["Boss"]

rarities:
  COMMON:
    name: "Thường"
    color: "&f"
    craft-shards: 20
    craft-cores: 0
    cost-mult: 1.0
    milestone-cores: 0        # Core cần khi nâng từ cấp 10, 20
  RARE:
    name: "Hiếm"
    color: "&9"
    craft-shards: 50
    cost-mult: 1.5
    milestone-cores: 1
  EPIC:
    name: "Sử Thi"
    color: "&5"
    craft-shards: 120
    cost-mult: 2.2
    milestone-cores: 2
  LEGENDARY:
    name: "Huyền Thoại"
    color: "&6"
    craft-shards: 300
    craft-cores: 2
    cost-mult: 3.5
    milestone-cores: 4
  MYTHIC:
    name: "Thần Thoại"
    color: "&c"
    craft-shards: 600
    craft-cores: 10
    cost-mult: 5.0
    milestone-cores: 6
  CELESTIAL:
    name: "Thiên Giới"
    color: "&b"
    craftable: false          # chỉ nhận từ sự kiện / Admin
    cost-mult: 7.0
    milestone-cores: 8

# Nguyên liệu rơi (chance 0.01 = 1%). Nội tại MATERIAL_LUCK nhân thêm vào tỉ lệ.
drops:
  block-break:
    dust:  {chance: 0.012,  min: 1, max: 2}
    shard: {chance: 0.003,  min: 1, max: 1}
    core:  {chance: 0.0002, min: 1, max: 1}
  mob-kill:
    dust:  {chance: 0.05,  min: 1, max: 2}
    shard: {chance: 0.02,  min: 1, max: 1}
    core:  {chance: 0.001, min: 1, max: 1}
  boss-kill:
    dust:  {chance: 1.0,  min: 5, max: 10}
    shard: {chance: 1.0,  min: 3, max: 6}
    core:  {chance: 0.25, min: 1, max: 2}

# Bộ Relic. Key là số món cần trang bị (tối đa 3 vì chỉ có 3 slot).
# Trang bị đủ 3 món cùng bộ: nhận bonus + aura riêng của bộ.
sets:
  frostborn:
    name: "&b❄ Frostborn"
    icon: BLUE_ICE
    aura: {particle: SNOWFLAKE, style: HELIX}
    bonuses:
      2: {SPEED: 2, HEALTH: 2}
      3: {SPEED: 4, HEALTH: 4, ARMOR: 1}
  infernal:
    name: "&c🔥 Infernal"
    icon: MAGMA_CREAM
    aura: {particle: FLAME, style: RING}
    bonuses:
      2: {DAMAGE: 4}
      3: {DAMAGE: 8, HEALTH: 4}
  abyss:
    name: "&8☠ Abyss"
    icon: ECHO_SHARD
    aura: {particle: SOUL, style: HALO}
    bonuses:
      2: {ARMOR: 2}
      3: {ARMOR: 3, HEALTH: 6, DAMAGE: 4}
  fortune:
    name: "&6$ Fortune"
    icon: GOLD_INGOT
    aura: {particle: HAPPY_VILLAGER, style: ORBIT}
    bonuses:
      2: {HEALTH: 4}
      3: {HEALTH: 8, ARMOR: 1}
  astral:
    name: "&d✦ Astral"
    icon: AMETHYST_SHARD
    aura: {particle: PORTAL, style: RING}
    bonuses:
      2: {SPEED: 3}
      3: {SPEED: 5, DAMAGE: 4}

# ------------------------------------------------------------
# 20 Di Vật.
#  group : ATTACK | GUARD | VITAL | SWIFT | MINER | MYSTIC
#  stats : HEALTH | DAMAGE | ARMOR | SPEED (giá trị ở cấp 1, tăng theo level-scale)
#  passive (nội tại ẩn, chỉ hiện khi đạt unlock-level):
#     type: LIFESTEAL THORNS CRIT DODGE EXECUTE BOSS_SLAYER LAST_STAND
#           KILL_SPEED HASTE KILL_HEAL LOW_HP_GUARD MATERIAL_LUCK FALL_GUARD REGEN
#     value, chance (CRIT/DODGE), cooldown (giây), unlock-level
#  aura  : particle (tên Particle), style (RING ORBIT HALO HELIX SPARK TRAIL),
#          color "#RRGGBB" (chỉ dùng khi particle là DUST)
# ------------------------------------------------------------
