# ============================================================
#  AstraxRelic - Hệ thống Di Vật độc quyền của AstraxBox
#  Mã màu dùng dấu & (vd: &a, &b, &6).
# ============================================================

messages:
  prefix: "&8[&bAstraxRelic&8] &7"

settings:
  slots: 5               # số slot trang bị (1-5)
  max-level: 30
  level-scale: 0.04      # chỉ số = base * (1 + (level-1) * level-scale)
  max-money-bonus: 10    # trần % bonus tiền (chống lạm phát kinh tế)

upgrade:
  dust-base: 10          # Dust cần = dust-base * (1 + level * dust-growth) * cost-mult
  dust-growth: 0.15

recycle:
  refund-ratio: 0.5      # hoàn lại 50% nguyên liệu khi tái chế

# Block nào được tính là "đào mỏ" (tên Material chứa một trong các từ này)
mining:
  mineable-tokens: [ORE, STONE, DEEPSLATE, ANCIENT_DEBRIS, NETHERRACK, OBSIDIAN, BASALT, BLACKSTONE]

# Cách nhận diện Boss (đủ 1 điều kiện là tính)
boss:
  min-health: 100
  types: [WITHER, ENDER_DRAGON, WARDEN, ELDER_GUARDIAN]
  name-keywords: ["Boss"]

# Độ hiếm
rarities:
  COMMON:
    name: "Thường"
    color: "&f"
    craft-shards: 20
    craft-cores: 0
    cost-mult: 1.0
    milestone-cores: 0     # Core cần khi nâng từ cấp 10, 20 (bội của 10)
  RARE:
    name: "Hiếm"
    color: "&9"
    craft-shards: 50
    cost-mult: 1.5
    milestone-cores: 1
  EPIC:
    name: "Sử Thi"
    color: "&5"
    craft-shards: 120
    cost-mult: 2.2
    milestone-cores: 2
  LEGENDARY:
    name: "Huyền Thoại"
    color: "&6"
    craft-shards: 300
    craft-cores: 2
    cost-mult: 3.5
    milestone-cores: 4
  MYTHIC:
    name: "Thần Thoại"
    color: "&c"
    craft-shards: 600
    craft-cores: 10
    cost-mult: 5.0
    milestone-cores: 6
  CELESTIAL:
    name: "Thiên Giới"
    color: "&b"
    craftable: false       # chỉ nhận từ sự kiện / Admin
    cost-mult: 7.0
    milestone-cores: 8

# Nguyên liệu rơi (chance 0.01 = 1%). Chỉ số MATERIAL_LUCK nhân thêm vào tỉ lệ.
drops:
  block-break:
    dust:  {chance: 0.012,  min: 1, max: 2}
    shard: {chance: 0.003,  min: 1, max: 1}
    core:  {chance: 0.0002, min: 1, max: 1}
  mob-kill:
    dust:  {chance: 0.05,  min: 1, max: 2}
    shard: {chance: 0.02,  min: 1, max: 1}
    core:  {chance: 0.001, min: 1, max: 1}
  boss-kill:
    dust:  {chance: 1.0,  min: 5, max: 10}
    shard: {chance: 1.0,  min: 3, max: 6}
    core:  {chance: 0.25, min: 1, max: 2}

# Bộ Relic (Set Bonus). Key là số món cần trang bị.
sets:
  frostborn:
    name: "&b❄ Frostborn"
    icon: BLUE_ICE
    bonuses:
      2: {MINING_EXP: 3}
      3: {MINING_EXP: 5, MATERIAL_LUCK: 5}
      4: {MINING_EXP: 8, EVENT_POINTS: 5}
  infernal:
    name: "&c🔥 Infernal"
    icon: MAGMA_CREAM
    bonuses:
      2: {COMBAT_EXP: 3}
      3: {COMBAT_EXP: 5, QUEST_POINTS: 3}
      4: {COMBAT_EXP: 8, BOSS_CONTRIBUTION: 5}
  astral:
    name: "&d✦ Astral"
    icon: AMETHYST_SHARD
    bonuses:
      2: {EVENT_POINTS: 3}
      3: {EVENT_POINTS: 5, TREASURE: 5}
      4: {EVENT_POINTS: 8, MATERIAL_LUCK: 8}
  fortune:
    name: "&6$ Fortune"
    icon: GOLD_INGOT
    bonuses:
      2: {MONEY: 2}
      3: {MONEY: 3, TREASURE: 5}
      4: {MONEY: 5, QUEST_POINTS: 5}
  abyss:
    name: "&8☠ Abyss"
    icon: ECHO_SHARD
    bonuses:
      2: {BOSS_CONTRIBUTION: 3}
      3: {BOSS_CONTRIBUTION: 6, MATERIAL_LUCK: 5}
      4: {BOSS_CONTRIBUTION: 10, EVENT_POINTS: 5}

# ------------------------------------------------------------
# 20 Di Vật.
#  trigger: BLOCK_BREAK | MOB_KILL | BOSS_KILL | QUEST_COMPLETE | EVENT_JOIN | ONLINE_MINUTE
#  charge-needed: số lần trigger để kích hoạt 1 lần thưởng
#  reward: shard/dust/core nhận được. reward-commands: lệnh console (dùng %player%)
#  QUEST_COMPLETE / EVENT_JOIN do plugin nhiệm vụ/sự kiện của bạn gọi:
#     /relicadmin trigger %player% QUEST_COMPLETE 1
# ------------------------------------------------------------
